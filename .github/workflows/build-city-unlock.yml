
name: Build GTA SA City Unlock AML ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build libGTA5CityUnlock.so
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip wget git

      - name: Fetch AndroidModLoader headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml
          test -f aml/mod/amlmod.h
          test -f aml/mod/iaml.h
          test -f aml/mod/interface.h
          test -f aml/mod/logger.h

      - name: Install Android NDK r27d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            -O android-ndk.zip
          unzip -q android-ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27d" >> "$GITHUB_ENV"

      - name: Configure ARM64
        run: |
          cmake -S . -B build-arm64 \
            -G Ninja \
            -DAML_ROOT="$GITHUB_WORKSPACE/aml" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-arm64 --parallel

      - name: Validate library
        run: |
          file build-arm64/libGTA5CityUnlock.so
          readelf -h build-arm64/libGTA5CityUnlock.so
          readelf -d build-arm64/libGTA5CityUnlock.so
          ls -lh build-arm64/libGTA5CityUnlock.so

      - name: Package mod
        run: |
          mkdir -p package/mods
          cp build-arm64/libGTA5CityUnlock.so package/mods/
          cp README.md package/
          cd package
          zip -r ../GTA5CityUnlock-AML-2.10-ARM64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA5CityUnlock-AML-2.10-ARM64
          path: GTA5CityUnlock-AML-2.10-ARM64.zip