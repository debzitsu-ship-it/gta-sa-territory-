name: Build GTA SA City Unlock AML ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip wget git

      - name: Fetch AML headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml
          test -f aml/mod/amlmod.h
          test -f aml/mod/iaml.h
          test -f aml/mod/interface.h

      - name: Install Android NDK r27d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            -O android-ndk.zip
          unzip -q android-ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27d" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build-arm64 -G Ninja \
            -DAML_ROOT="$GITHUB_WORKSPACE/aml" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-arm64 --parallel

      - name: Check build
        run: |
          set -eux
          ls -lah build-arm64/
          file build-arm64/libGTA5CityUnlock.so
          test -f build-arm64/libGTA5CityUnlock.so

      - name: Create package
        run: |
          set -eux
          rm -rf package
          mkdir -p package/mods
          cp build-arm64/libGTA5CityUnlock.so package/mods/

          echo "Package contents:"
          find package -type f -ls

          cd package
          zip -r ../GTA5CityUnlock-2.0-AML-2.10-ARM64.zip .

      - name: Check ZIP
        run: |
          set -eux
          ls -lh GTA5CityUnlock-2.0-AML-2.10-ARM64.zip
          unzip -l GTA5CityUnlock-2.0-AML-2.10-ARM64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA5CityUnlock-2.0-AML-2.10-ARM64
          path: |
            GTA5CityUnlock-2.0-AML-2.10-ARM64.zip
            build-arm64/libGTA5CityUnlock.so
          if-no-files-found: error